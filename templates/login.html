<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cloud Drive 登录</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2ff 0%, #f4f5fb 55%, #fdf4ff 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .login-card { background: white; width: 400px; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px -12px rgba(79,70,229,.25); border: 1px solid #e8eaf2; }
        .brand-mark { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(79,70,229,.35); }
        .input-field { background-color: #f4f5fb; border: 1px solid transparent; border-radius: 12px; padding: 12px 16px; width: 100%; outline: none; transition: all 0.2s; color: #0f172a; }
        .input-field:focus { background: #fff; border-color: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
        .btn-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; box-shadow: 0 6px 16px rgba(79,70,229,.35); }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .footer-text { color: #94a3b8; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="login-card text-center">
        <div class="brand-mark">☁</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">我的云盘 Pro</h1>
        <p class="text-sm text-gray-400 mb-8">Cloud Drive</p>
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div><input type="text" id="username" placeholder="请输入账号" class="input-field" required></div>
            <div><input type="password" id="password" placeholder="请输入密码" class="input-field" required></div>
            <button type="submit" class="btn-primary">验证登录</button>
        </form>
        <form id="totpForm" onsubmit="handleTotp(event)" class="space-y-5" style="display:none">
            <p class="text-sm text-gray-500">密码正确，请输入验证器 App 里的 6 位验证码</p>
            <div><input type="text" id="totpCode" placeholder="6 位验证码" inputmode="numeric" maxlength="6" class="input-field text-center" style="letter-spacing: 0.4em" required></div>
            <button type="submit" class="btn-primary">验证并登录</button>
            <button type="button" onclick="backToLogin()" class="text-sm text-gray-400 hover:text-gray-600">返回重新输入密码</button>
        </form>
        <p class="footer-text">© Powered by 小龙女她爸</p>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = '登录中...'; btn.disabled = true;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') { window.location.href = '/'; }
                else if (res.ok && data.status === 'need_totp') { document.getElementById('loginForm').style.display = 'none'; document.getElementById('totpForm').style.display = 'block'; document.getElementById('totpCode').focus(); }
                else { alert(data.message || '登录失败'); btn.innerText = originalText; btn.disabled = false; }
            } catch (err) { alert('网络错误'); btn.innerText = originalText; btn.disabled = false; }
        }
        function backToLogin() { document.getElementById('totpForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; }
        async function handleTotp(e) {
            e.preventDefault();
            const btn = document.querySelector('#totpForm button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = '验证中...'; btn.disabled = true;
            try {
                const res = await fetch('/api/login/totp', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ code: document.getElementById('totpCode').value })
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') { window.location.href = '/'; }
                else { alert(data.message || '验证码错误'); btn.innerText = originalText; btn.disabled = false; }
            } catch (err) { alert('网络错误'); btn.innerText = originalText; btn.disabled = false; }
        }
    </script>
</body>
</html>
