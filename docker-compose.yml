# 用法：先 cp .env.example .env 并填好 ADMIN_PASS / SECRET_KEY（install.sh 会自动生成），
# 再 docker compose up -d --build
# 注意：ADMIN_PASS / SECRET_KEY 没有默认值，缺了 compose 会直接报错，杜绝默认密码上线。
services:
  app:
    build: .
    image: my-cloud-drive:latest
    container_name: my-cloud-drive-app
    restart: always
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?请在 .env 里设置 ADMIN_PASS}
      - SECRET_KEY=${SECRET_KEY:?请在 .env 里设置 SECRET_KEY}
      - SHARE_EXPIRE_DAYS=${SHARE_EXPIRE_DAYS:-30}
      - QUOTA_GB=${QUOTA_GB:-0}
      - READONLY_MOUNT_PATH=${READONLY_MOUNT_PATH:-}
      - READONLY_MOUNT_NAME=${READONLY_MOUNT_NAME:-外部只读}
      - ARIA2_SECRET=${ARIA2_SECRET:-}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - TRASH_PATH=/app/trash
      - SHARE_PATH=/app/shares
    volumes:
      - ./data/storage:/app/storage
      - ./data/trash:/app/trash
      - ./data/shares:/app/shares
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: my-cloud-drive-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: my-cloud-drive-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      app:
        condition: service_healthy
